[package]
name = "pykyber"
version = "1.0.5"
edition = "2021"

[lib]
name = "pykyber"
crate-type = ["lib", "cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module", "abi3-py38"] }
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
rand_core = "0.6"

[features]
# Exposes the ML-KEM `*_internal` functions that take caller-chosen randomness,
# for vector tests only (FIPS 203 section 3.3). Never enable it in a release.
acvp = []

[dev-dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
