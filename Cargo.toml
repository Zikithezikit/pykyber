[package]
name = "pykyber"
version = "1.0.1"
edition = "2021"

[lib]
name = "pykyber"
crate-type = ["lib", "cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module", "abi3-py38"] }
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
rand_core = "0.6"

[dev-dependencies]
rand = "0.8"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
