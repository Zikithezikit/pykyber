name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  linux-pypy:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 'pypy-3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter pypy3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: 2_34
          container: off
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-pypy-${{ matrix.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

  android:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          local-cache: true
      - name: Prepare PYO3_CROSS_LIB_DIR
        run: |
          NDK="$ANDROID_NDK_ROOT"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          ANDROID_API=24
          PYVER="${{ matrix.python-version }}"
          MOCK_DIR="${{ github.workspace }}/android_python_${{ matrix.target }}_${{ matrix.python-version }}"
          mkdir -p "$MOCK_DIR"

          case "${{ matrix.target }}" in
            aarch64-linux-android)   CLANG_TARGET="aarch64-linux-android${ANDROID_API}" ;;
            armv7-linux-androideabi) CLANG_TARGET="armv7a-linux-androideabi${ANDROID_API}" ;;
            x86_64-linux-android)    CLANG_TARGET="x86_64-linux-android${ANDROID_API}" ;;
          esac

          "$TOOLCHAIN/bin/${CLANG_TARGET}-clang" -shared \
            -Wl,-soname,"libpython${PYVER}.so" \
            -o "$MOCK_DIR/libpython${PYVER}.so" -xc /dev/null

          case "${{ matrix.target }}" in
            aarch64-linux-android)   LIBDL_ARCH="aarch64-linux-android" ;;
            armv7-linux-androideabi) LIBDL_ARCH="arm-linux-androideabi" ;;
            x86_64-linux-android)    LIBDL_ARCH="x86_64-linux-android" ;;
          esac
          LIBDL=$(find "$TOOLCHAIN/sysroot/usr/lib/$LIBDL_ARCH" -name libdl.so | head -1)
          [ -n "$LIBDL" ] && cp "$LIBDL" "$MOCK_DIR/"

          SYSCONFIG_NAME="_sysconfigdata__linux_${{ matrix.target }}"
          cat > "$MOCK_DIR/${SYSCONFIG_NAME}.py" << EOF
          build_time_vars = {
              'abiflags': '',
              'ABIFLAGS': '',
              'SO': '.so',
              'SOABI': 'cpython-${PYVER}',
              'EXT_SUFFIX': '.so',
              'LIBDIR': '$MOCK_DIR',
              'LDLIBRARY': 'libpython${PYVER}.so',
              'Py_ENABLE_SHARED': 1,
              'CC': 'clang',
              'CXX': 'clang++',
              'VERSION': '${PYVER}',
              'LDSHARED': 'clang -shared',
              'LDFLAGS': '-L$MOCK_DIR',
              'CCSHARED': '-fPIC',
              'GNULD': 'yes',
              'Py_DEBUG': 0,
              'WITH_PYMALLOC': 1,
          }
          EOF

          echo "PYO3_CROSS_LIB_DIR=$MOCK_DIR" >> "$GITHUB_ENV"
          echo "PYO3_CROSS_PYTHON_VERSION=$PYVER" >> "$GITHUB_ENV"

          RFLAGS_VAR="CARGO_TARGET_$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS"
          echo "$RFLAGS_VAR=-C link-arg=-Wl,--no-as-needed -C link-arg=-lpython${PYVER} -C link-arg=-Wl,--unresolved-symbols=ignore-all" >> "$GITHUB_ENV"
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: off
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-android-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v5
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, linux-pypy, musllinux, windows, macos, android, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v6
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
